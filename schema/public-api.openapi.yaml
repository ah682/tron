openapi: 3.1.0
info:
  title: TRON Public Website Content API
  version: 1.0.0
  description: >-
    Presentation-safe contract for a possible public content service behind the
    static TRON shareholder website. This document contains public response
    shapes only. It intentionally excludes infrastructure, database, deployment,
    authentication, internal hostnames, credentials, and operational details.
servers:
  - url: https://api.example.invalid
    description: Placeholder only; replace during an approved integration.
tags:
  - name: Network
  - name: Market
  - name: Blocks
  - name: Insights
  - name: Search
paths:
  /v1/network/snapshot:
    get:
      tags: [Network]
      operationId: getNetworkSnapshot
      summary: Return the public homepage network metrics
      responses:
        "200":
          description: Current public network snapshot
          headers:
            Cache-Control:
              schema: { type: string }
              example: public, max-age=60, stale-while-revalidate=300
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkSnapshotResponse"
        default:
          $ref: "#/components/responses/PublicError"
  /v1/market/trx:
    get:
      tags: [Market]
      operationId: getTrxMarketSnapshot
      summary: Return presentation-safe TRX market data
      parameters:
        - in: query
          name: currency
          schema: { type: string, enum: [USD], default: USD }
        - in: query
          name: range
          schema: { type: string, enum: [30d], default: 30d }
      responses:
        "200":
          description: TRX market snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshotResponse"
        default:
          $ref: "#/components/responses/PublicError"
  /v1/blocks/latest:
    get:
      tags: [Blocks]
      operationId: getLatestBlock
      summary: Return the latest public block summary
      responses:
        "200":
          description: Latest public block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestBlockResponse"
        default:
          $ref: "#/components/responses/PublicError"
  /v1/insights:
    get:
      tags: [Insights]
      operationId: listInsights
      summary: Return published public insight cards
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 3 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Published insights ordered newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightListResponse"
        default:
          $ref: "#/components/responses/PublicError"
  /v1/search:
    get:
      tags: [Search]
      operationId: searchPublicSite
      summary: Search the approved public index
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - in: query
          name: locale
          schema: { type: string, pattern: "^[A-Za-z]{2,3}(?:-[A-Za-z0-9]+)?$", default: en }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        "200":
          description: Ranked public results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/PublicError"
        default:
          $ref: "#/components/responses/PublicError"
components:
  responses:
    PublicError:
      description: Safe public error response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PublicProblem"
  schemas:
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId, generatedAt, sourceAsOf]
      properties:
        requestId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        sourceAsOf: { type: string, format: date-time }
    NetworkSnapshot:
      type: object
      additionalProperties: false
      required: [totalTransactions, totalAccounts, totalValueLockedUsd, transferVolume24hUsd, blockTimeSeconds]
      properties:
        totalTransactions: { type: integer, minimum: 0 }
        totalAccounts: { type: integer, minimum: 0 }
        totalValueLockedUsd: { type: number, minimum: 0 }
        transferVolume24hUsd: { type: number, minimum: 0 }
        blockTimeSeconds: { type: number, exclusiveMinimum: 0 }
    NetworkSnapshotResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/NetworkSnapshot" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    MarketPoint:
      type: object
      additionalProperties: false
      required: [timestamp, price]
      properties:
        timestamp: { type: string, format: date-time }
        price: { type: number, minimum: 0 }
    MarketSnapshot:
      type: object
      additionalProperties: false
      required: [symbol, currency, currentPrice, marketCap, globalRank, transactionVolume24h, transactions24h, accountsHoldingTrx, chart]
      properties:
        symbol: { type: string, const: TRX }
        currency: { type: string, const: USD }
        currentPrice: { type: number, minimum: 0 }
        marketCap: { type: number, minimum: 0 }
        globalRank: { type: integer, minimum: 1 }
        transactionVolume24h: { type: number, minimum: 0 }
        transactions24h: { type: integer, minimum: 0 }
        accountsHoldingTrx: { type: integer, minimum: 0 }
        chart:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/MarketPoint" }
    MarketSnapshotResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/MarketSnapshot" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    LatestBlock:
      type: object
      additionalProperties: false
      required: [number, producer, transactions, timestamp, blockTimeSeconds]
      properties:
        number: { type: integer, minimum: 0 }
        producer: { type: string, minLength: 1, maxLength: 120 }
        transactions: { type: integer, minimum: 0 }
        timestamp: { type: string, format: date-time }
        blockTimeSeconds: { type: number, exclusiveMinimum: 0 }
    LatestBlockResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/LatestBlock" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    Insight:
      type: object
      additionalProperties: false
      required: [id, title, publishedAt, url, featured]
      properties:
        id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        title: { type: string, minLength: 1, maxLength: 240 }
        summary: { type: string, maxLength: 500 }
        publishedAt: { type: string, format: date }
        url: { type: string, format: uri }
        imageUrl: { type: string, format: uri-reference }
        featured: { type: boolean }
    InsightListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Insight" }
        nextCursor: { type: [string, "null"] }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    SearchResult:
      type: object
      additionalProperties: false
      required: [title, description, url, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 300 }
        url: { type: string, format: uri-reference }
        category: { type: string, enum: [learn, developer, ecosystem, governance, resource] }
    SearchResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/SearchResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    PublicProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, maxLength: 120 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 300 }
        requestId: { type: string, format: uuid }
